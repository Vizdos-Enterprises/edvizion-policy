name: Test AWS SSM Secrets

on:
  workflow_dispatch:

  push:
    paths:
      - "actions/aws-secrets/**"

  pull_request:
    paths:
      - "actions/aws-secrets/**"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./actions/aws-secrets
        with:
          parameters: |
            DEMO_SECURE=/github/shared/testing/demo-secure-token
            DEMO_PLAINTEXT=/github/shared/testing/demo-plaintext-token
            DEMO_SCOPED=/github/edvizion-policy/testing/demo

      - name: Verify values
        shell: bash
        run: |
          set -euo pipefail

          [[ "$DEMO_SECURE" == "demo-secure-123" ]] || {
            echo "::error::Secure parameter did not match"
            exit 1
          }

          [[ "$DEMO_PLAINTEXT" == "demo-plaintext-123" ]] || {
            echo "::error::Plaintext parameter did not match"
            exit 1
          }

          [[ "$DEMO_SCOPED" == "demo-scoped-123" ]] || {
            echo "::error::Scoped parameter did not match"
            exit 1
          }

          echo "All values loaded correctly."

      - name: Demonstrate masking
        shell: bash
        run: |
          echo "Secure: $DEMO_SECURE"
          echo "Plaintext: $DEMO_PLAINTEXT"
          echo "Scoped: $DEMO_SCOPED"

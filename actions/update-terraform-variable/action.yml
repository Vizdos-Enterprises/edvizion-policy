
name: Update Terraform Variable
description: Update a Terraform variable default and open a PR

inputs:
  repository:
    required: false
    description: Target GitHub repository (defaults to current repository)
    default: ${{ github.repository }}
  tf-path:
    required: true
    description: Path to Terraform file relative to repository root
  variable:
    required: true
    description: Terraform variable name
  value:
    required: true
    description: New default value (string)

runs:
  using: composite
  steps:
    - name: Load GitHub App credentials
      uses: vizdos-enterprises/edvizion-policy/actions/aws-secrets@main
      with:
        parameters: |
          ORG_GO_APP_ID=/github/shared/github_app_id
          ORG_GO_APP_PRIVATE_KEY=/github/shared/github_app_secret

    - name: Mint GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ env.ORG_GO_APP_ID }}
        private-key: ${{ env.ORG_GO_APP_PRIVATE_KEY }}
        owner: vizdos-enterprises
        permission-contents: write
        permission-pull-requests: write

    - name: Checkout target repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        token: ${{ steps.app-token.outputs.token }}
        path: terraform-target
        persist-credentials: false

    - name: Update Terraform variable
      shell: bash
      working-directory: terraform-target
      env:
        TF_PATH: ${{ inputs.tf-path }}
        TF_VARIABLE: ${{ inputs.variable }}
        TF_VALUE: ${{ inputs.value }}
      run: |
        python3 - <<'PY'
        import os
        import re
        from pathlib import Path

        path = Path(os.environ["TF_PATH"])
        variable = re.escape(os.environ["TF_VARIABLE"])
        value = os.environ["TF_VALUE"]

        content = path.read_text()

        pattern = (
            rf'(variable\s+"{variable}"\s*\{{'
            rf'[^}}]*?\bdefault\s*=\s*)("[^"]*")'
        )

        replacement = lambda m: (
            m.group(1) + '"' + value + '"'
        )

        updated, count = re.subn(
            pattern, replacement, content, count=1,
            flags=re.DOTALL
        )

        if count != 1:
            raise ValueError(f"Variable not found: {variable}")

        path.write_text(updated)
        PY

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        path: terraform-target
        token: ${{ steps.app-token.outputs.token }}
        base: main
        branch: automation/update-${{ inputs.variable }}
        add-paths: ${{ inputs.tf-path }}
        commit-message: "chore: update ${{ inputs.variable }} to ${{ inputs.value }}"
        title: "chore: update ${{ inputs.variable }} to ${{ inputs.value }}"
        body: |
          Automated Terraform variable update.

          File: `${{ inputs.tf-path }}`
          Variable: `${{ inputs.variable }}`
          Value: `${{ inputs.value }}`
        delete-branch: true
